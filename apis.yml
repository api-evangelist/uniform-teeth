name: Uniform Teeth
description: 'Uniform Teeth was a San Francisco clear-aligner orthodontics startup founded by
  Meghan Jewitt and orthodontist Dr. Kjeld Aamodt, launched in 2018, pairing licensed in-clinic
  orthodontists with a patient app — positioned between traditional orthodontics and
  direct-to-consumer aligners. Canaan Partners led its $10M Series A. On August 5, 2022 it was
  acquired by (merged with) Barcelona-based Impress (smile2impress.com) to build a worldwide
  network of invisible-orthodontic clinics. The company published no public developer API, SDK,
  or developer portal, and uniformteeth.com no longer serves a site (stale Netlify deployment
  returning 404); this API Evangelist profile records its identity and domain posture.'
